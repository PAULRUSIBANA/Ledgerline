services:
  - type: web
    name: ledgerline-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CORS_ORIGIN
        value: https://REPLACE-WITH-YOUR-NETLIFY-SITE.netlify.app
